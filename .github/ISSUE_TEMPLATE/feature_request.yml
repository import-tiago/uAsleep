name: Feature request
description: Propose a focused improvement to uAsleep.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What engineering or usability problem would this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the desired behavior without prescribing implementation details.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain any workarounds or alternative designs.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sketches, references, or example calculations when useful.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: The request fits a local, privacy-preserving battery estimator.
          required: true

