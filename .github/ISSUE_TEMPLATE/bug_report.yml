name: Bug report
description: Report reproducible incorrect behavior in uAsleep.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not include credentials or
        sensitive data. Security issues must follow `SECURITY.md`.

  - type: input
    id: version
    attributes:
      label: App version
      description: Find this in Settings → About.
      placeholder: 2.0.0+6
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: Pixel 8, Android 16
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest sequence that consistently reproduces the issue.
      placeholder: |
        1. Open…
        2. Enter…
        3. Tap…
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add logs, screenshots, or sample input values when useful.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This report does not contain credentials or sensitive data.
          required: true

