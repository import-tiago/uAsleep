name: uasleep
description: Battery-life estimator for embedded and IoT devices.
publish_to: none
version: 2.1.0+7
homepage: https://github.com/import-tiago/uAsleep
repository: https://github.com/import-tiago/uAsleep
issue_tracker: https://github.com/import-tiago/uAsleep/issues

environment:
  sdk: ^3.12.2

dependencies:
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  package_info_plus: ^10.2.1
  path_provider: ^2.1.5
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true

flutter_launcher_icons:
  android: ic_launcher
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#071A33"
  adaptive_icon_foreground: assets/branding/app_icon.png
  adaptive_icon_foreground_inset: 20
  min_sdk_android: 21
  remove_alpha_ios: true
